name = "lucastang-dev-api"
main = "src/index.js"
compatibility_date = "2026-08-09"

# lucastang.dev's DNS currently points directly at GitHub Pages (not
# proxied through Cloudflare), so a route on this zone won't intercept
# requests — the frontend calls this Worker's own *.workers.dev subdomain
# instead (see GITHUB_API_URL in boot.js), relying on the CORS headers in
# src/index.js. If you later move DNS onto Cloudflare, a route becomes an
# option:
# routes = [
#   { pattern = "lucastang.dev/api/*", zone_name = "lucastang.dev" }
# ]

# Required secret (never committed): a GitHub personal access token with the
# `public_repo` scope. Originally just for raising the GitHub API rate limit
# to 5000/hr; that scope also grants write access to code on public repos,
# which /api/leaderboard's POST handler now uses to commit score updates to
# the leaderboard-data branch (see LEADERBOARD_* constants in src/index.js)
# — no separate token or Cloudflare resource needed.
#   wrangler secret put GITHUB_TOKEN

# /api/leaderboard reads/writes leaderboard.json on a dedicated
# "leaderboard-data" branch of this repo (not main) via the GitHub API, so
# no KV/D1 binding is needed here. That branch needs to exist before the
# first score submission — see the leaderboard PR description for the
# one-time setup, or create it directly:
#   git checkout --orphan leaderboard-data
#   git rm -rf .
#   echo "[]" > leaderboard.json
#   git add leaderboard.json && git commit -m "chore: init leaderboard data branch"
#   git push -u origin leaderboard-data
