<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riceology</title>
<link rel="icon" href="../favicon.ico">
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card-hover: #23272f;
    --text: #e8e8e8;
    --muted: #8b8f98;
    --accent: #6c9bff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 2rem 1.5rem 4rem;
  }
  header {
    max-width: 1100px;
    margin: 0 auto 2rem;
  }
  h1 {
    margin: 0 0 0.25rem;
    font-size: 1.8rem;
  }
  header p {
    margin: 0;
    color: var(--muted);
  }
  #search {
    max-width: 1100px;
    margin: 0 auto 1.5rem;
    display: block;
    width: 100%;
    padding: 0.7rem 1rem;
    border-radius: 8px;
    border: 1px solid #2c303a;
    background: var(--card);
    color: var(--text);
    font-size: 1rem;
  }
  #search:focus { outline: 2px solid var(--accent); }
  .grid {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 0.75rem;
  }
  button.game {
    all: unset;
    cursor: pointer;
    background: var(--card);
    border: 1px solid #2c303a;
    border-radius: 10px;
    padding: 1rem;
    text-align: center;
    font-size: 0.95rem;
    transition: background 0.12s ease, transform 0.12s ease;
  }
  button.game:hover {
    background: var(--card-hover);
    transform: translateY(-2px);
  }
  button.game:active { transform: translateY(0); }
</style>
</head>
<body>
<header>
  <h1>Riceology</h1>
  <p>Click a game to play it fullscreen in its own window.</p>
</header>

<input id="search" type="text" placeholder="Search games…" oninput="filterGames()">
<div class="grid" id="grid"></div>

function playGame(url) {
  const win = window.open(
    "",
    "_blank",
    "toolbar=no,location=no,menubar=no,scrollbars=no,resizable=yes"
  );
  if (!win) {
    alert("Popup blocked — allow popups for this site to play.");
    return;
  }
  win.document.title = "";
  win.document.body.style.margin = "0";
  win.document.body.style.background = "#000";

  const iframe = win.document.createElement("iframe");
  iframe.src = GAMES_BASE + url;
  iframe.style.border = "none";
  iframe.style.width = "100vw";
  iframe.style.height = "100vh";
  iframe.allow = "fullscreen; autoplay; gamepad; pointer-lock";
  iframe.setAttribute("allowfullscreen", "true");
  win.document.body.appendChild(iframe);

  iframe.addEventListener("load", () => {
    iframe.requestFullscreen?.().catch(() => {});
  });
}

function renderGrid(list) {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  for (const g of list) {
    const btn = document.createElement("button");
    btn.className = "game";
    btn.textContent = g.name;
    btn.onclick = () => playGame(g.url);
    grid.appendChild(btn);
  }
}

function filterGames() {
  const q = document.getElementById("search").value.toLowerCase();
  renderGrid(games.filter(g => g.name.toLowerCase().includes(q)));
}

renderGrid(games);
